name: CI

on:
  push:
    branches: [main, branche-machines]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Sur Ubuntu, python3-tk n'est pas installé par défaut — même piège
      # que celui rencontré sur macOS pendant l'audit du 1er septembre 2026.
      - name: Installer Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install simpy matplotlib gradio pytest

      - name: Lancer les tests (headless sur Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pytest tests/ -v
          else
            pytest tests/ -v
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ruff et vulture
        run: pip install ruff vulture

      # Non-bloquant pour l'instant : le code existant remonte 227 avertissements
      # pyflakes/erreurs (mesuré le 1er septembre 2026) — les rendre bloquants
      # demanderait un nettoyage préalable hors du périmètre de ce ticket (#18).
      # Objectif : visibilité immédiate sur les PR, sans bloquer personne.
      - name: ruff check (informatif)
        continue-on-error: true
        run: ruff check .

      # vulture est l'outil qui aurait détecté #3 (les 15 classes mixins
      # jamais héritées, ~6000 lignes) — vérifié : à confiance par défaut (60%),
      # il les repère toutes, plus core/event_bus.py et core/sim/machine.py.
      # Non-bloquant pour la même raison que ruff ci-dessus.
      - name: vulture — détection de code mort (informatif)
        continue-on-error: true
        run: vulture core ui main.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Tk + xvfb (Linux)
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install simpy matplotlib gradio pytest pytest-cov

      # Mesuré le 1er septembre 2026 : 21% de couverture globale — la majorité
      # du code UI n'est pas couverte (cohérent avec le couplage Tkinter déjà
      # documenté dans #3/#9 de l'audit). Publié en artefact téléchargeable,
      # pas en badge externe (nécessiterait un compte Codecov tiers).
      - name: Lancer les tests avec couverture
        run: |
          xvfb-run -a pytest tests/ --cov=core --cov=ui \
            --cov-report=term-missing --cov-report=html

      - name: Publier le rapport HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30
